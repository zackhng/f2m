[project]
name = "f2m"
version = "0.1.0"
description = "Convert PDF, DOCX, PPTX, XLSX, HTML and images to Markdown, with a pluggable image handler"
readme = "README.md"
authors = [
    { email = "zh007227@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "filetype>=1.2.0",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "typer>=0.27.3",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.13",
]
calc = [
    "formulas>=1.3.4",
]

[project.scripts]
f2m = "f2m.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "xlsxwriter>=3.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
